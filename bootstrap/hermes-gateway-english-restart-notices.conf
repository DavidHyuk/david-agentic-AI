# Purpose: report English-profile systemd restart causes through its own bot.
[Service]
ExecStopPost=-/usr/bin/python3 %h/.hermes/scripts/cron_health.py --hermes-home %h/.hermes/profiles/english --profile english --gateway-service hermes-gateway-english.service --service-event stop
ExecStartPost=-/usr/bin/python3 %h/.hermes/scripts/cron_health.py --hermes-home %h/.hermes/profiles/english --profile english --gateway-service hermes-gateway-english.service --service-event start
