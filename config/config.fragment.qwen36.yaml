# Hermes config for Qwen3.6-35B-A3B-AWQ via local vLLM (:8003).
# Apply by replacing config.fragment.yaml, then:
#   python3 bootstrap/stage.py
#   hermes gateway restart
#
# Start model first:
#   bash local-model/download_model.sh qwen36
#   bash local-model/run_model.sh qwen36

providers:
  qwen36-hermes:
    base_url: http://localhost:8003/v1
    model: Qwen3.6-35B-A3B-AWQ
    context_length: 65536
    extra_body:
      presence_penalty: 0.6
      repetition_penalty: 1.05

model:
  provider: custom:qwen36-hermes
  default: Qwen3.6-35B-A3B-AWQ
  context_length: 65536

memory:
  memory_enabled: true
  user_profile_enabled: true
  memory_char_limit: 2200
  user_char_limit: 1375

cron:
  wrap_response: true

skills: {}
