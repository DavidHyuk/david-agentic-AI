# Hermes config for Qwen3.6-35B-A3B-FP8 via local vLLM (:8003).
# Apply by replacing config.fragment.yaml, then:
#   python3 bootstrap/stage.py
#   hermes gateway restart
#
# Start model first:
#   bash local-model/download_model.sh qwen36
#   bash local-model/run_model.sh qwen36

providers:
  qwen36-fp8-hermes:
    base_url: http://localhost:8003/v1
    model: Qwen3.6-35B-A3B-FP8
    context_length: 131072
    extra_body:
      presence_penalty: 1.5
      repetition_penalty: 1.0
      top_k: 20
      min_p: 0.0

model:
  provider: custom:qwen36-fp8-hermes
  default: Qwen3.6-35B-A3B-FP8
  context_length: 131072

browser:
  cloud_provider: local
  engine: chrome
  cdp_url: http://127.0.0.1:19222
  command_timeout: 30

memory:
  memory_enabled: true
  user_profile_enabled: true
  memory_char_limit: 2200
  user_char_limit: 1375

cron:
  wrap_response: true
  max_parallel_jobs: 1

skills: {}
