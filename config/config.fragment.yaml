# Non-secret Hermes config merged into ~/.hermes/config.yaml by stage.py.
# Secrets (the local endpoint API key) go in ~/.hermes/.env instead.

# --- Named provider: Qwen3.5-122B-A10B-AWQ via vLLM on the DGX Spark ----------
# Using a named entry under `providers:` (rather than the bare `model.provider:
# custom` shorthand) is required for Hermes to attach `extra_body` fields to
# every API call.  The runtime resolves `model.provider: custom:qwen-hermes` →
# finds this entry → merges extra_body into request_overrides for every call.
#
# presence_penalty : 0.6   (OpenAI standard field; valid range 0.25–1.1)
# repetition_penalty: 1.05 (vLLM extension field; mild n-gram loop suppression)
providers:
  qwen-hermes:
    base_url: http://localhost:8003/v1
    model: Qwen3.5-122B-A10B-AWQ    # matches --served-model-name in run_hermes_model.sh
    context_length: 65536
    extra_body:
      presence_penalty: 0.6
      repetition_penalty: 1.05

# --- Main model: reference the named provider above --------------------------
model:
  provider: custom:qwen-hermes
  default: Qwen3.5-122B-A10B-AWQ
  context_length: 65536

# --- Persistent memory -------------------------------------------------------
memory:
  memory_enabled: true
  user_profile_enabled: true
  memory_char_limit: 2200
  user_char_limit: 1375

# --- Cron delivery -----------------------------------------------------------
cron:
  wrap_response: true

# --- Skills: scan this repo's skills dir as an external source so edits in the
# repo show up without re-staging (stage.py also copies them into ~/.hermes).
skills:
  external_dirs:
    - /home/david/workspace/david-agentic-ai/skills
