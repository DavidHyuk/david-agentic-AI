# Non-secret Hermes config merged into ~/.hermes/config.yaml by stage.py.
# Secrets (the local endpoint API key) go in ~/.hermes/.env instead.

# --- Model: Qwen3.5-122B-A10B-AWQ via vLLM on the DGX Spark ---------------------
# Served by local-model/run_hermes_model.sh (vllm serve on :8003).
# Same weights as ClawGram (/home/david/workspace/ClawGram/models/Qwen/Qwen3.5-122B-A10B-AWQ).
#
# Sampling defaults are set at the vLLM server level via run_hermes_model.sh:
#   --presence-penalty  0.6    (range 0.25–1.1; reduces topic fixation across turns)
#   --repetition-penalty 1.05  (mild HF-style n-gram penalty; prevents output looping)
# These apply when Hermes does not override them in individual API calls.
model:
  provider: custom
  base_url: http://localhost:8003/v1
  default: Qwen3.5-122B-A10B-AWQ      # matches --served-model-name in run_hermes_model.sh
  context_length: 65536

# --- Persistent memory ------------------------------------------------------
memory:
  memory_enabled: true
  user_profile_enabled: true
  memory_char_limit: 2200
  user_char_limit: 1375

# --- Cron delivery ----------------------------------------------------------
cron:
  wrap_response: true

# --- Skills: scan this repo's skills dir as an external source so edits in the
# repo show up without re-staging (stage.py also copies them into ~/.hermes).
skills:
  external_dirs:
    - /home/david/workspace/david-agentic-ai/skills
