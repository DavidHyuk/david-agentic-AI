# Hermes config for MiniMax-M2.7 via local vLLM (:8003).
# Apply by replacing config.fragment.yaml or merging manually, then:
#   python3 bootstrap/stage.py
#   hermes config set model.provider custom:minimax-hermes
#
# Start model first:
#   cd /home/david/workspace/models && python3 download_model.py cyankiwi/MiniMax-M2.7-AWQ-4bit
#   bash local-model/run_model.sh minimax

providers:
  minimax-hermes:
    base_url: http://localhost:8003/v1
    model: MiniMax-M2.7-AWQ-4bit
    context_length: 65536
    extra_body:
      presence_penalty: 0.6
      repetition_penalty: 1.05
      temperature: 1.0
      top_p: 0.95

model:
  provider: custom:minimax-hermes
  default: MiniMax-M2.7-AWQ-4bit
  context_length: 65536

browser:
  cloud_provider: local
  engine: chrome
  cdp_url: http://127.0.0.1:19222
  command_timeout: 30

memory:
  memory_enabled: true
  user_profile_enabled: true
  memory_char_limit: 2200
  user_char_limit: 1375

cron:
  wrap_response: true
  max_parallel_jobs: 1

skills: {}
