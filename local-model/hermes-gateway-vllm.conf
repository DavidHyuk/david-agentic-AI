# Purpose: start the Hermes gateway only after its local model is ready.
[Unit]
Requires=hermes-vllm.service
After=hermes-vllm.service

[Service]
ExecStartPre=/usr/bin/python3 %h/.hermes/scripts/wait_for_vllm.py --url http://127.0.0.1:8003/v1/models --expected-model Qwen3.8-Flash-Next-UD-IQ4_XS --timeout 900
TimeoutStartSec=930
