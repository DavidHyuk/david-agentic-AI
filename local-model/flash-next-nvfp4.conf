# __author__ = 'David Choi (bestshoot21@gmail.com)'
# Purpose: use the Spark NVFP4 backend under the shared model unit.
[Service]
WorkingDirectory=%h/workspace/David-Agent
ExecStartPre=
ExecStartPre=/usr/bin/python3 %h/workspace/ClawGram-Agent/clawgram/spark_memory_guard.py --data-root %h/.local/share/clawgram --check-only --minimum-available-gib 2 --minimum-free-gib 0.25 --free-warning-available-gib 4
ExecStart=
ExecStart=/usr/bin/python3 %h/workspace/David-Agent/local-model/run_flash_next_nvfp4.py
UnsetEnvironment=LD_LIBRARY_PATH
KillSignal=SIGTERM
TimeoutStopSec=45
UMask=0077
