services:
  clawgram-gateway:
    image: nvcr.io/nvidia/pytorch:26.02-py3
    container_name: clawgram-gateway
    working_dir: /app
    volumes:
      - .:/app
    ports:
      - "8080:8080"
    shm_size: '64gb'
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    environment:
      - NVIDIA_VISIBLE_DEVICES=all
      - CUDA_DEVICE_ORDER=PCI_BUS_ID
      - TORCH_CUDA_ARCH_LIST=12.1+PTX
      # 라이브러리 경로를 시스템의 모든 가능성 있는 곳으로 확장
      - LD_LIBRARY_PATH=/usr/local/cuda/lib64:/usr/local/cuda/targets/aarch64-linux/lib:/usr/local/nvidia/lib:/usr/local/nvidia/lib64:$LD_LIBRARY_PATH
    command: >
      bash -c "
        echo '--- [1/3] Force Linking CUDA 13 to 12 ---' &&
        # 실제 존재하는 libcudart.so.13을 찾아서 .12로 강제 연결
        REAL_CUDA_LIB=\$(find /usr/local/cuda -name 'libcudart.so.13' | head -n 1) &&
        CUDA_DIR=\$(dirname \$REAL_CUDA_LIB) &&
        ln -sf \$REAL_CUDA_LIB \$CUDA_DIR/libcudart.so.12 &&
        export LD_LIBRARY_PATH=\$CUDA_DIR:\$LD_LIBRARY_PATH &&
        
        echo '--- [2/3] Installing Dependencies ---' &&
        pip install --upgrade pip &&
        # vllm 설치 시 CUDA 13용 인덱스 사용 시도 (안될 경우 대비해 --no-deps 병행)
        pip install --no-cache-dir vllm --extra-index-url https://download.pytorch.org/whl/cu131 || pip install vllm --no-deps &&
        # requirements.txt 설치 (이미 설치된 핵심 패키지는 건드리지 않음)
        pip install -r requirements.txt --ignore-installed torch torchvision vllm &&
        
        echo '--- [3/3] Launching Qwen 3.5 122B ---' &&
        # 런타임에 한 번 더 경로 확인
        ldconfig &&
        python gateway/main.py
      "