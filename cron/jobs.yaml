# Scheduled telegram notifications for David's Hermes agent.
#
# Registered by bootstrap/register_cron.py via `hermes cron create`. Schedules are
# cron expressions evaluated in the gateway host's local timezone
# (set the host to America/Los_Angeles). The English jobs run in the isolated
# `english` profile, so delivery uses its dedicated Telegram bot.
#
# Cron jobs run in a FRESH session, so every prompt is self-contained and names the
# skill(s) it relies on. Keep prompts skimmable — these are push notifications.

defaults:
  deliver: telegram

jobs:
  - name: papers-digest
    schedule: "30 8 * * *"           # 08:30 daily, after the 08:00 ingestion timer
    skills: [papers-digest]
    deliver_chat_id_env: PAPERS_TELEGRAM_CHAT_ID
    prompt: >
      Send my daily LLM/LVM research signal. Use the papers-digest skill: pull
      recommended papers from the last four days plus today's Hugging Face
      popularity signal, lead with a one-line takeaway, then list at most five
      items with a one-line why-it-matters and an interview-relevance angle for
      Staff/Senior MLE. Include a visible clickable canonical https URL on its
      own Link line for every paper; never send a paper without its URL. If the
      catalog is stale, report its ingestion status instead of launching a
      scraper. Invoke helpers with python3 exactly; the python command is
      unavailable. Keep it skimmable.

  - name: interview-prep
    schedule: "0 12 * * 1,3,5"      # 12:00 Mon/Wed/Fri
    skills: [interview-prep]
    deliver_chat_id_env: INTERVIEW_TELEGRAM_CHAT_ID
    prompt: >
      Deliver today's Staff/Senior MLE interview drill. Use the interview-prep
      skill: read my progress log, pick ONE under-covered pillar, then run
      interview_trends.py for that pillar to pull current real-world signal (hot
      repos, HN discourse, recent papers). Ground the drill + resources in that live
      signal, send a what-good-looks-like rubric and 1-2 current resources, and
      append what you covered to the progress log. Invoke helpers with python3
      exactly; the python command is unavailable.

  - name: coding-coach
    schedule: "0 12 * * 2,4,6"      # 12:00 Tue/Thu/Sat
    skills: [interview-prep]
    deliver_chat_id_env: LEETCODE_TELEGRAM_CHAT_ID
    prompt: >
      Deliver today's Coding Coach using the interview-prep skill's Coding Coach
      procedure. Run python3 ~/.hermes/scripts/interview_progress.py plan coding
      and send the actual study message it returns. Include the concrete problem,
      pattern, goal, 35-minute target, and visible clickable canonical NeetCode and
      LeetCode URLs. Due weak reviews take priority over new curriculum problems.
      Start as a beginner; try 20 minutes without AI first. Offer only staged hints,
      never a solution first. Do not log a completed session until I report results.
      Never replace the study item with a generic reminder.

  - name: system-design-coach
    schedule: "0 12 * * 0"          # 12:00 Sunday
    skills: [interview-prep]
    deliver_chat_id_env: SYSTEM_DESIGN_TELEGRAM_CHAT_ID
    prompt: >
      Deliver today's System Design Coach using the interview-prep skill's System
      Design Coach procedure. Run python3 ~/.hermes/scripts/interview_progress.py
      plan system_design and send the actual study message it returns. Include
      the concrete Hello Interview topic/problem and visible clickable canonical
      Hello Interview URL, a 45–60 minute target, 3–5 things I should be able to
      explain afterward, and its connection to my real Agent/Hermes experience.
      Retain the timed 45-minute mock for Design a Notification System and any
      access note/free supporting links. Do not log completion without my results.
      Never replace the study item with a generic reminder.

  - name: english-intake
    schedule: "0 20 * * 1-6"        # 20:00 Mon-Sat coaching
    profile: english
    skills: [english-practice]
    prompt: >
      Deliver the 20:00 English coaching using the english-practice skill. First
      run english_intake.py with python3 and process any new KakaoTalk or lesson
      feedback through Procedure A. With no new feedback, follow Procedure D: use
      english_srs.py weaknesses and stats to explain one or two evidence-backed
      weak patterns, include a clearly labeled generated practice example, and ask
      one short production question. Do not stay silent merely because no new
      lesson arrived, and never invent a teacher correction.

  - name: english-drill
    schedule: "0 21 * * *"          # 21:00 every day
    profile: english
    skills: [english-practice]
    prompt: >
      Send tonight's English drill. Use the english-practice skill (drill branch):
      run english_srs.py due and deliver the due cards as a Korean-guided rewrite
      drill. Put each answer immediately below its corresponding question, labeled
      정답. Never send a drill without answers and never collect the answers in a
      separate answer key. Prioritize weak patterns observed in the recent tutor
      feedback. I may still reply with my attempts for grading. If nothing is due,
      reply only [SILENT].

  - name: english-weekly-review
    schedule: "0 20 * * 0"          # 20:00 Sunday, dedicated English review
    profile: english
    skills: [english-practice]
    prompt: >
      Deliver the dedicated weekly English review using the english-practice skill
      and Procedure E. Run english_intake.py --week, then english_srs.py weaknesses
      and stats with python3. Send this only through the English Telegram bot:
      summarize this week's tutor feedback, the top three recurring patterns,
      representative actual corrections when available, weak SRS cards, a
      three-question rewrite challenge with each answer immediately below its
      question, and one measurable focus for next week. Do not invent teacher
      corrections. This is a standalone weekly review, not a daily intake message.

  - name: weekly-review
    schedule: "0 18 * * 0"          # 18:00 Sunday
    skills: [papers-digest, interview-prep]
    prompt: >
      Write my weekly review. Summarize: (1) the most important LLM/LVM papers this
      week and one I should deep-read, (2) interview-prep pillars covered vs
      neglected from the progress log with next week's focus. Run python3
      ~/.hermes/scripts/interview_progress.py weekly and include its measured
      coding sessions completed, new vs review problems, weak patterns, average
      solving time, hint usage and solutions viewed, system-design topics covered,
      weakest design dimension, and next week's recommended focus. Distinguish
      missing feedback from completed study; never invent scores. End with 2 concrete
      goals for next week tied to landing a Staff/Senior MLE role. English coaching
      and SRS progress are delivered only through the dedicated English Telegram bot.
